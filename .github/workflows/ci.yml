name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run checks
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux runtime
        run: docker build -t autosocial:ci .
      - name: Verify Chromium, image decoder, FFmpeg and downloader
        run: |
          docker run --rm --entrypoint node autosocial:ci scripts/doctor.js
          docker run --rm --network none --shm-size 1g --entrypoint node autosocial:ci -e "require('playwright').chromium.launch({headless:true}).then(async b=>{await b.close();await require('sharp')({create:{width:8,height:8,channels:3,background:'red'}}).jpeg().toBuffer()}).catch(()=>process.exit(1))"
