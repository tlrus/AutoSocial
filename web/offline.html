<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>AutoSocial — нет связи</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; padding:24px; display:grid; place-items:center; color:#f4f4f5; background:#09090b; font:16px/1.65 system-ui,sans-serif; }
    main { width:100%; max-width:400px; padding:28px; background:#18181b; border:1px solid #3f3f46; border-radius:18px; }
    .logo { display:grid; place-items:center; width:48px; height:48px; border-radius:12px; color:white; background:#3b82f6; font-size:28px; font-weight:750; }
    h1 { font-size:24px; line-height:1.35; margin:24px 0 12px; }
    p { color:#a1a1aa; margin:0 0 24px; }
    button { display:block; width:100%; min-height:48px; padding:12px; border:0; border-radius:8px; background:#3b82f6; color:white; font:600 16px/1.5 system-ui,sans-serif; text-align:center; cursor:pointer; }
    button:focus-visible { outline:3px solid #93c5fd; outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="AutoSocial">A</div>
    <h1>Нет связи с AutoSocial</h1>
    <p>Не удалось подключиться к сервису. Проверьте интернет и повторите подключение.</p>
    <form action="/" method="get"><button type="submit">Повторить подключение</button></form>
  </main>
</body>
</html>
